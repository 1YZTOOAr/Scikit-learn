[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-sales"
version = "0.1.0"
description = "Educational retail sales analysis and prediction exercise"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
]

[project.optional-dependencies]
test = ["pytest"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocs-static-i18n>=1.3"]

[project.scripts]
retail-sales = "retail_sales.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
