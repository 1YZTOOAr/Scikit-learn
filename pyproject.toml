[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ventas-minoristas"
version = "0.1.0"
description = "Ejercicio didáctico de análisis y predicción de ventas minoristas"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
ventas-minoristas = "ventas_minoristas.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
